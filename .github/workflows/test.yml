name: test
on:
  push:
  workflow_dispatch:
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Scoop
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          "$env:USERPROFILE\scoop\shims" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install the previous release
        run: |
          scoop bucket add coredence "https://github.com/$env:GITHUB_REPOSITORY"
          $kova = "$env:USERPROFILE\scoop\buckets\coredence"
          $m = Get-Content "$kova\bucket\coredence.json" -Raw | ConvertFrom-Json
          $yeni = $m.version
          $liste = gh api repos/coredence/coredence/releases --jq '.[].tag_name' | ForEach-Object { $_.TrimStart('v') }
          $eski = ($liste | Where-Object { $_ -ne $yeni })[0]
          $a = (gh api "repos/coredence/coredence/releases/tags/v$eski" | ConvertFrom-Json).assets
          $d = ($a | Where-Object name -eq "coredence-windows-$eski.zip").digest
          $m.version = $eski
          $m.architecture.'64bit'.url = "https://github.com/coredence/coredence/releases/download/v$eski/coredence-windows-$eski.zip"
          $m.architecture.'64bit'.hash = $d.Replace('sha256:','')
          $m | ConvertTo-Json -Depth 8 | Set-Content "$kova\bucket\coredence.json"
          scoop install coredence
          git -C $kova checkout -- .
          "OLD=$eski" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "NEW=$yeni" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Both command names work
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path','User') + ';' + $env:Path
          $null | coredence --help > $null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $null | coredence.bat --help > $null
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Hourly task follows an update
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path','User') + ';' + $env:Path
          $null | coredence schedule on
          scoop update coredence
          $t = schtasks /query /tn CoredenceEngineRefresh /xml | Out-String
          $t -split "`n" | Select-String -Pattern 'Command|WorkingDirectory'
          if ($t -notmatch "WorkingDirectory>[^<]*\\($env:NEW|current)<") { Write-Error "task still points at the old version"; exit 1 }
          if ($t -match [regex]::Escape($env:OLD)) { Write-Error "task mentions $env:OLD"; exit 1 }
      - name: Update cleanup does not break the task
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path','User') + ';' + $env:Path
          scoop cleanup coredence
          schtasks /run /tn CoredenceEngineRefresh
          Start-Sleep -Seconds 15
          schtasks /query /tn CoredenceEngineRefresh /v /fo LIST | Select-String 'Last Result','Status'
          exit 0
      - name: Uninstall
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path','User') + ';' + $env:Path
          $null | coredence schedule off
          scoop uninstall coredence
          if (Test-Path "$env:USERPROFILE\scoop\apps\coredence") { exit 1 }
          $p = [Environment]::GetEnvironmentVariable('Path','User')
          if ($p -match 'apps\\coredence') { Write-Error "PATH still has it"; exit 1 }
